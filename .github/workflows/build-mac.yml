name: Build macOS DMG

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build-mac:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Vite app
        run: npm run build

      - name: Build macOS DMG
        run: npx electron-builder --mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Force Ensure Public Release Exists
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0 --title "v1.0" --notes "Initial Release" 2>/dev/null || true
          gh release edit v1.0 --draft=false 2>/dev/null || true
          shopt -s nullglob
          for asset in dist_electron/*.dmg dist_electron/*.zip dist_electron/latest-mac.yml; do
            [ -f "$asset" ] && gh release upload v1.0 "$asset" --clobber
          done

      - name: Upload DMG as artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: Teletraan-macOS-DMG
          path: dist_electron/*.dmg
